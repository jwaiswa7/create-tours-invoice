<svg xmlns="http://www.w3.org/2000/svg" width="794" height="120" viewBox="0 0 794 120">
  <!-- setting sun -->
  <circle cx="610" cy="74" r="38" fill="#e9b949" opacity="0.45"/>
  <!-- Kilimanjaro-style mountain with snow cap -->
  <path d="M290 76 L372 30 L386 36 L400 27 L490 76 Z" fill="#2d9a52" opacity="0.35"/>
  <path d="M372 30 L380 26 L394 24 L400 27 L392 32 L386 36 Z" fill="#ffffff" opacity="0.8"/>
  <!-- rolling savannah hills -->
  <path d="M0 78 Q110 62 230 76 T470 74 T794 70 V120 H0 Z" fill="#1f7a3d" opacity="0.55"/>
  <!-- ground band -->
  <rect x="0" y="74" width="794" height="46" fill="#14532d"/>

  <!-- birds -->
  <g fill="none" stroke="#14532d" stroke-width="1.6" stroke-linecap="round" opacity="0.7">
    <path d="M540 30 q4 -4 8 0 q4 -4 8 0"/>
    <path d="M562 20 q3 -3 6 0 q3 -3 6 0"/>
    <path d="M580 34 q3 -3 6 0 q3 -3 6 0"/>
  </g>

  <g fill="#14532d" stroke="#14532d">
    <!-- acacia tree (left) -->
    <g transform="translate(70 76)">
      <path d="M0 0 L-2 -28 L-14 -44 M-2 -28 L10 -46 M-2 -28 L-2 -46" fill="none" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="-2" cy="-48" rx="38" ry="7" stroke="none"/>
      <ellipse cx="-8" cy="-53" rx="24" ry="5" stroke="none"/>
    </g>

    <!-- giraffe -->
    <g transform="translate(170 76)" stroke="none">
      <path d="M0 -26 L4 -34 L26 -31 L29 -22 L2 -21 Z"/>
      <rect x="3" y="-23" width="2.6" height="23"/>
      <rect x="8" y="-23" width="2.6" height="23"/>
      <rect x="21" y="-24" width="2.6" height="24"/>
      <rect x="25.5" y="-24" width="2.6" height="24"/>
      <path d="M22 -31 L34 -64 L39 -62 L29 -27 Z"/>
      <path d="M33 -66 L45 -61 L45 -58 L36 -58 Z"/>
      <path d="M35 -66 L34 -71 M38 -65 L38 -70" fill="none" stroke="#14532d" stroke-width="1.4"/>
      <path d="M1 -25 L-4 -12" fill="none" stroke="#14532d" stroke-width="1.4"/>
    </g>

    <!-- small acacia -->
    <g transform="translate(265 76)">
      <path d="M0 0 L0 -20 L-8 -30 M0 -20 L7 -31" fill="none" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="-32" rx="22" ry="4.5" stroke="none"/>
    </g>

    <!-- elephant -->
    <g transform="translate(520 76)" stroke="none">
      <ellipse cx="0" cy="-24" rx="22" ry="15"/>
      <circle cx="20" cy="-29" r="10"/>
      <path d="M27 -27 Q33 -12 28 -2 L24 -2 Q27 -12 22 -22 Z"/>
      <rect x="-17" y="-14" width="7" height="14"/>
      <rect x="-8" y="-14" width="7" height="14"/>
      <rect x="6" y="-14" width="7" height="14"/>
      <rect x="14" y="-14" width="7" height="14"/>
      <path d="M-21 -26 L-26 -12" fill="none" stroke="#14532d" stroke-width="1.6"/>
    </g>

    <!-- acacia tree (right) -->
    <g transform="translate(725 76)">
      <path d="M0 0 L2 -32 L-12 -48 M2 -32 L14 -50 M2 -32 L2 -50" fill="none" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="2" cy="-52" rx="42" ry="7.5" stroke="none"/>
      <ellipse cx="8" cy="-58" rx="26" ry="5.5" stroke="none"/>
    </g>
  </g>
</svg>
